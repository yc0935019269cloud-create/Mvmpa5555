<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>視光室｜選擇練習模式</title><link rel="icon" href="data:,"><link rel="stylesheet" href="shared.css"><style>main{max-width:1120px;margin:70px auto;padding:24px}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:35px}.card{display:flex;flex-direction:column;min-height:330px;padding:28px}.card p{line-height:1.9;color:var(--muted)}.card .button{margin-top:auto;text-align:center}.number{font:42px Georgia;color:var(--gold);margin-bottom:25px}@media(max-width:800px){main{margin-top:20px}.modes{grid-template-columns:1fr}.card{min-height:260px}}</style><header><strong>視光室</strong><span class="muted">THE REFRACTION ROOM</span></header><main><p class="eyebrow">PRACTICE STUDIO</p><h1>選一張桌，開始練習。</h1><p class="muted">診間操作、投影機控制與單眼主覺驗光。</p><div class="modes"><article class="panel card"><div class="number">01</div><h2>第一人稱診間</h2><p>進入原有 Unity 診間，操作實體儀器、量瞳距、檢影與完成紀錄。</p><a class="button" href="../index.html">進入 3D 診間</a></article><article class="panel card"><div class="number">02</div><h2>ACP-8 遙控器</h2><p>依照片操作完整面板。上方投影幕同步顯示 A 型 30 張圖卡，練習遮罩、紅綠濾片與程序控制。</p><a class="button primary" href="remote.html">拿起遙控器</a></article><article class="panel card"><div class="number">03</div><h2>2D 綜合驗光儀</h2><p>自訂或隨機雙眼病例。從雙眼檢影開始，依序完成右眼、左眼的 MPMVA、紅綠與 JCC。</p><a class="button primary" href="refraction.html">開始單獨驗光</a></article></div><p class="muted" style="margin-top:25px;font-size:13px">2D 練習可離線使用。患者反應與檢影為教學近似模型。</p></main></html>

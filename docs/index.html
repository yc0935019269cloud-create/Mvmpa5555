<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>視光室｜第一人稱驗光練習</title>
<meta name="description" content="走進診間，拿起檢影鏡、調整綜合驗光儀，完成期中範圍的第一人稱驗光練習。Unity × Blender。"><link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10201e;color:#eaeada;font-family:system-ui,'Noto Sans TC',sans-serif}#unity-canvas{width:100%;height:100%;display:block;background:#21332e;outline:0}#loading{position:absolute;inset:0;display:grid;place-content:center;background:radial-gradient(ellipse at 65% 30%,#30443c,#0e1c19 70%);z-index:3;text-align:center;transition:opacity .4s}#loading h1{font-weight:400;letter-spacing:.35em;font-size:clamp(36px,6vw,72px);margin:14px 0}#loading p{color:#b6c3b4;font-size:15px;line-height:1.8}#loading small{letter-spacing:.18em;color:#bca16e}progress{appearance:none;width:300px;height:3px;margin:30px auto;border:0;background:#34483f}progress::-webkit-progress-bar{background:#34483f}progress::-webkit-progress-value{background:#bca16e}#error{white-space:pre-wrap;color:#ffccad;max-width:700px;line-height:1.6}#mobile{display:none;color:#d8c69a;max-width:330px;margin:auto}#fullscreen{position:absolute;right:18px;bottom:8px;z-index:2;border:1px solid #9ba69455;background:#13251ddd;color:#d8dfcd;padding:7px 12px;cursor:pointer;font-size:12px;border-radius:2px}#clinic-state{display:none}#qa-bar{display:none;position:fixed;left:0;bottom:0;z-index:10;background:#fff;color:#111;padding:4px;font:11px monospace}#qa-bar pre{max-width:800px;white-space:pre-wrap;margin:4px}#qa-bar button{margin:2px}
</style></head><body>
<canvas id="unity-canvas" tabindex="0" aria-label="視光室 Unity 第一人稱驗光遊戲"></canvas>
<div id="loading"><small>THE REFRACTION ROOM</small><h1>視 光 室</h1><p>一個診間，一次完整的期中驗光練習。<br>正在準備儀器與診間模型…</p><progress id="progress" max="1" value="0"></progress><p id="load-label">載入 Unity WebGL</p><p id="mobile">本版以鍵盤滑鼠為主，請使用電腦瀏覽器體驗第一人稱操作。</p><div id="error" role="alert"></div></div>
<button id="fullscreen" aria-label="全螢幕">⛶ 全螢幕</button><output id="clinic-state" aria-live="off"></output>
<div id="qa-bar"><button id="qa-start">教學開始</button><button id="qa-flow">執行流程驗證</button><pre id="qa-state"></pre></div>
<script>
const canvas=document.getElementById('unity-canvas'),bar=document.getElementById('loading'),status=document.getElementById('load-label');
window.clinicErrors=[];window.addEventListener('error',e=>window.clinicErrors.push(e.message));
if(/Android|iPhone|iPad/i.test(navigator.userAgent))document.getElementById('mobile').style.display='block';
const config={dataUrl:'Build/b93e6a7f89ac67c218a3dd05d51bd326.data.unityweb',frameworkUrl:'Build/dbdc15e80899567c145ee5487cc92de5.framework.js.unityweb',codeUrl:'Build/14bf05430e975efad599dd99beb20251.wasm.unityweb',streamingAssetsUrl:'StreamingAssets',companyName:'subaiyaya',productName:'視光室',productVersion:'1.0.0',autoSyncPersistentDataPath:true,devicePixelRatio:Math.min(window.devicePixelRatio,1.5),showBanner:(msg,type)=>{if(type==='error'){document.getElementById('error').textContent=msg;bar.style.display='grid';}}};
const script=document.createElement('script');script.src='Build/821000414d668b2544f5b9a4f7393b9e.loader.js';script.onerror=()=>{document.getElementById('error').textContent='遊戲檔案下載失敗，請重新整理。';};
script.onload=()=>createUnityInstance(canvas,config,p=>{document.getElementById('progress').value=p;status.textContent=p>.9?'正在開啟診間…':'載入診間 '+Math.round(p*100)+'%';}).then(instance=>{window.clinicUnity=instance;bar.style.opacity=0;setTimeout(()=>bar.style.display='none',400);document.getElementById('fullscreen').onclick=()=>instance.SetFullscreen(1);document.getElementById('qa-start').onclick=()=>instance.SendMessage('Clinic runtime','Begin','教學');document.getElementById('qa-flow').onclick=()=>instance.SendMessage('Clinic runtime','RunQA');}).catch(e=>{document.getElementById('error').textContent='Unity 無法啟動：'+e;});document.body.appendChild(script);
if(new URLSearchParams(location.search).get('qa')==='1'){document.getElementById('qa-bar').style.display='block';setInterval(()=>document.getElementById('qa-state').textContent=document.getElementById('clinic-state').textContent,250);}
window.addEventListener('keydown',e=>{if(['Tab','Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)&&document.activeElement===canvas)e.preventDefault();});
document.addEventListener('pointerlockchange',()=>{if(window.clinicUnity)window.clinicUnity.SendMessage('Clinic runtime','PointerState',document.pointerLockElement===canvas?'1':'0');});
canvas.addEventListener('pointerdown',e=>{if(window.clinicWantsLook&&e.button===0){try{const p=canvas.requestPointerLock();if(p&&p.catch)p.catch(()=>{});}catch(error){}}});
</script></body></html>
